# Production / demo deploy (Render free tier — in-memory H2, re-seeds on restart)
spring.datasource.url=jdbc:h2:mem:cartly;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

server.port=${PORT:8080}

# Set in Render dashboard after Cloudflare URL is known
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://cartly.pages.dev,http://localhost:5173}

app.jwt.secret=${APP_JWT_SECRET:change-this-in-render-dashboard-min-32-chars-long}
app.jwt.expiration-ms=86400000
